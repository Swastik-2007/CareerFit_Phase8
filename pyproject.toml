[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careerfit"
version = "0.6.0"
description = "Explainable resume intelligence with fairness sensitivity auditing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pypdf>=5.0,<7.0",
  "python-docx>=1.1,<2.0",
  "pandas>=2.1,<3.0",
  "scikit-learn==1.8.0",
  "joblib>=1.3,<2.0",
  "networkx>=3.2,<4.0"
]

[project.scripts]
careerfit = "careerfit.cli:main"

[tool.setuptools.packages.find]
include = ["careerfit*"]

[tool.setuptools.package-data]
"careerfit.taxonomy" = ["*.json"]
"careerfit.growth" = ["*.json"]
